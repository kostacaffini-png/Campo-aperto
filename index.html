<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CAFFINI - Scelta ugelli campo aperto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Roboto+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#15171b;
    --panel:#1e2126;
    --panel-2:#262a31;
    --line:#33383f;
    --text:#eef0f2;
    --text-dim:#9aa1ab;
    --accent:#00952b;
    --accent-dim:#00611c;
    --good:#4caf6d;
  }
  html[data-theme="light"]{
    --bg:#f4f5f7;
    --panel:#ffffff;
    --panel-2:#eef0f3;
    --line:#dde1e6;
    --text:#1a1d21;
    --text-dim:#6b7280;
    --accent:#00952b;
    --accent-dim:#00611c;
    --good:#2e8b47;
  }
  html{transition:background .2s ease;}
  body{transition:background .2s ease, color .2s ease;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;}
  body{
    min-height:100vh;
    padding-bottom:40px;
  }
  .logo-wrap{
    display:flex;justify-content:center;align-items:center;
    padding:18px 20px 4px;
  }
  .logo-wrap img{
    max-width:220px;width:100%;height:auto;display:block;
  }
  .settings-bar{
    display:flex;align-items:center;justify-content:space-between;
    padding:12px 16px 0;
  }
  .lang-toggle{
    display:flex;gap:2px;background:var(--panel);border:1px solid var(--line);
    border-radius:8px;padding:2px;
  }
  .lang-btn{
    padding:5px 11px;border-radius:6px;border:none;background:transparent;
    color:var(--text-dim);font-family:'Inter',sans-serif;font-size:11px;font-weight:700;
    letter-spacing:.03em;cursor:pointer;
  }
  .lang-btn.active{background:var(--accent);color:#fff;}
  .theme-btn{
    width:32px;height:32px;border-radius:50%;border:1px solid var(--line);
    background:var(--panel);color:var(--text);font-size:15px;
    display:flex;align-items:center;justify-content:center;cursor:pointer;
    padding:0;
  }
  .theme-btn:active{opacity:.8;}
  .topbar{
    display:flex;align-items:center;justify-content:center;gap:10px;
    padding:8px 20px 14px;
    border-bottom:1px solid var(--line);
  }
  .topbar .mark{
    width:34px;height:34px;border-radius:8px;
    background:var(--accent);
    display:flex;align-items:center;justify-content:center;
    font-family:'Oswald',sans-serif;font-weight:700;font-size:17px;color:#15171b;
    flex-shrink:0;
  }
  .topbar h1{
    font-family:'Oswald',sans-serif;font-weight:600;font-size:16px;
    letter-spacing:.03em;text-transform:uppercase;margin:0;color:var(--text);
    text-align:center;
  }
  .topbar .titlebox{text-align:center;}
  .topbar span{display:block;font-size:11.5px;color:var(--text-dim);margin-top:1px;}

  .gauge-wrap{
    padding:26px 20px 8px;
    display:flex;flex-direction:column;align-items:center;
  }
  .gauge{position:relative;width:260px;height:150px;}
  .gauge svg{width:100%;height:100%;display:block;}
  .gauge-readout{
    position:absolute;bottom:2px;left:0;right:0;
    text-align:center;
  }
  .gauge-readout .val{
    font-family:'Oswald',sans-serif;font-weight:700;font-size:44px;
    color:var(--accent); line-height:1;
    font-variant-numeric:tabular-nums;
  }
  .gauge-readout .unit{
    font-family:'Inter',sans-serif;font-size:12px;color:var(--text-dim);
    letter-spacing:.08em;text-transform:uppercase;margin-top:2px;
  }
  .subreadout{
    display:flex;gap:22px;justify-content:center;margin-top:6px;
  }
  .subreadout div{text-align:center;}
  .subreadout .n{
    font-family:'Roboto Mono',monospace;font-weight:500;font-size:15px;color:var(--text);
  }
  .subreadout .l{
    font-size:10.5px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.06em;margin-top:2px;
  }

  .tabs{
    display:flex;gap:8px;padding:14px 20px 0;
  }
  .tab-btn{
    flex:1;padding:11px 8px;border-radius:10px;border:1px solid var(--line);
    background:var(--panel);color:var(--text-dim);
    font-family:'Inter',sans-serif;font-size:12.5px;font-weight:600;
    letter-spacing:.02em;text-align:center;
    display:flex;align-items:center;justify-content:center;gap:6px;
  }
  .tab-icon{
    width:18px;height:18px;border-radius:50%;object-fit:cover;flex-shrink:0;
    background:#fff;
  }
  .tab-swatches{display:flex;gap:3px;align-items:center;flex-wrap:wrap;justify-content:center;}
  .tab-dot{width:8px;height:8px;border-radius:50%;border:1px solid rgba(255,255,255,.25);flex-shrink:0;}
  #tabColorati{flex-direction:column;gap:4px;}
  .tab-btn.active{
    background:var(--accent);border-color:var(--accent);color:#0d1a10;
  }
  .tab-btn:active{opacity:.85;}

  .section{padding:18px 20px 4px;}
  .section h2{
    font-family:'Oswald',sans-serif;font-size:13px;text-transform:uppercase;
    letter-spacing:.08em;color:var(--text-dim);margin:0 0 10px;font-weight:500;
  }

  .card{
    background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:14px;margin-bottom:14px;
  }
  .field{margin-bottom:12px;}
  .field:last-child{margin-bottom:0;}
  .field label{
    display:block;font-size:12.5px;color:var(--text-dim);margin-bottom:6px;
  }
  .field .input-row{display:flex;align-items:center;gap:8px;}
  .field input[type=number]{
    flex:1;background:var(--panel-2);border:1px solid var(--line);border-radius:9px;
    color:var(--text);font-family:'Roboto Mono',monospace;font-size:17px;font-weight:500;
    padding:11px 12px;width:100%;outline:none;
  }
  .field input[type=number]:focus{border-color:var(--accent);}
  .field .u{font-size:12px;color:var(--text-dim);min-width:44px;}

  .nozzle-grid{display:flex;flex-direction:column;gap:8px;}
  .nozzle-row{
    display:grid;grid-template-columns:1fr 1fr 74px;gap:8px;align-items:center;
    background:var(--panel-2);border:1px solid var(--line);border-radius:10px;
    padding:9px 10px;
  }
  .nozzle-row.active{border-color:var(--accent-dim);}
  .nozzle-meta{display:flex;flex-direction:row;align-items:center;gap:8px;}
  .nozzle-meta .swatch{
    width:16px;height:16px;border-radius:50%;flex-shrink:0;
    border:1px solid rgba(255,255,255,.25);
  }
  .nozzle-meta .text-col{display:flex;flex-direction:column;gap:1px;}
  .nozzle-icon{
    width:24px;height:24px;border-radius:50%;object-fit:cover;flex-shrink:0;
    background:#fff;
  }
  .nozzle-icons{display:flex;align-items:center;gap:4px;flex-shrink:0;}
  .nozzle-meta .top{font-family:'Roboto Mono',monospace;font-size:13.5px;color:var(--text);}
  .nozzle-meta .bot{font-size:10.5px;color:var(--text-dim);}
  .nozzle-flow{text-align:right;}
  .nozzle-flow .fv{font-family:'Roboto Mono',monospace;font-size:13px;color:var(--text-dim);}
  .nozzle-flow .fl{font-size:9.5px;color:var(--text-dim);}
  .nozzle-row input[type=number]{
    background:var(--panel);border:1px solid var(--line);border-radius:8px;
    color:var(--text);font-family:'Roboto Mono',monospace;font-size:15px;font-weight:500;
    padding:8px;width:100%;text-align:center;outline:none;
  }
  .nozzle-row input[type=number]:focus{border-color:var(--accent);}

  .footer-note{
    padding:14px 20px 4px;font-size:11.5px;color:var(--text-dim);line-height:1.5;
  }
  .footer-note b{color:var(--text);}

  .reset-btn{
    margin:16px 20px 0;padding:12px;width:calc(100% - 40px);
    background:transparent;border:1px solid var(--line);border-radius:10px;
    color:var(--text-dim);font-family:'Inter',sans-serif;font-size:13px;font-weight:600;
    letter-spacing:.02em;
  }
  .reset-btn:active{background:var(--panel-2);}
  #gaugeTrack{stroke:var(--line);}

  /* ===== Preset, configurazioni salvate, portagetto doppio ===== */
  .cfg-select,.cfg-input{
    width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:9px;
    color:var(--text);font-family:'Inter',sans-serif;font-size:14px;
    padding:11px 12px;outline:none;min-width:0;
  }
  .cfg-select:focus,.cfg-input:focus{border-color:var(--accent);}
  .cfg-row{display:flex;gap:8px;align-items:stretch;}
  .cfg-row > .cfg-select,.cfg-row > .cfg-input{flex:1;}
  .cfg-btn{
    padding:0 14px;min-height:42px;border-radius:9px;border:1px solid var(--line);
    background:var(--panel-2);color:var(--text);font-family:'Inter',sans-serif;
    font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;
  }
  .cfg-btn:active{opacity:.8;}
  .cfg-btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
  .cfg-btn.danger{color:#ef4444;}
  .cfg-desc{font-size:11.5px;color:var(--text-dim);line-height:1.5;white-space:pre-line;margin-top:4px;}
  .cfg-desc:empty{display:none;}
  .cfg-msg{font-size:12px;margin-top:10px;line-height:1.4;}
  .cfg-msg:empty{display:none;}
  .cfg-msg.ok{color:var(--good);}
  .cfg-msg.err{color:#ef4444;}
  .toggle-row{display:flex;align-items:center;gap:10px;font-size:13.5px;cursor:pointer;line-height:1.35;}
  .toggle-row input{width:20px;height:20px;accent-color:var(--accent);flex-shrink:0;margin:0;}
  .series-tabs{display:flex;gap:8px;margin-top:12px;}
  .series-btn{
    flex:1;padding:10px 8px;border-radius:10px;border:1px solid var(--line);
    background:var(--panel-2);color:var(--text);font-family:'Inter',sans-serif;
    text-align:center;display:flex;flex-direction:column;gap:2px;cursor:pointer;
  }
  .series-btn.active{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset;}
  .series-btn .s-name{font-weight:700;font-size:13px;}
  .series-btn .s-dose{font-size:11px;color:var(--text-dim);}
  .series-btn .s-press{font-family:'Roboto Mono',monospace;font-size:14px;font-weight:500;}
  .serie-badge{
    display:inline-block;margin-bottom:10px;padding:4px 10px;border-radius:999px;
    background:var(--accent);color:#fff;font-size:11.5px;font-weight:700;letter-spacing:.02em;
  }
  .serie-badge[hidden]{display:none;}

  /* ===== Report PDF ===== */
  #reportView{position:fixed;inset:0;z-index:1000;background:#fff;color:#111;overflow:auto;font-family:'Inter',sans-serif;}
  #reportView .r-bar{position:sticky;top:0;display:flex;gap:8px;justify-content:flex-end;padding:10px 14px;background:#f1f3f5;border-bottom:1px solid #d5d9de;}
  #reportView .r-btn{padding:10px 16px;border-radius:9px;border:1px solid #c5cad1;background:#fff;color:#111;font-family:'Inter',sans-serif;font-size:13px;font-weight:600;cursor:pointer;}
  #reportView .r-btn.primary{background:#00952b;border-color:#00952b;color:#fff;}
  #reportView .r-page{max-width:800px;margin:0 auto;padding:22px 22px 40px;}
  #reportView .r-head{display:flex;align-items:center;justify-content:space-between;gap:16px;border-bottom:3px solid #00952b;padding-bottom:12px;margin-bottom:16px;}
  #reportView .r-head img{max-width:150px;height:auto;display:block;}
  #reportView .r-title{font-family:'Oswald',sans-serif;font-size:20px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;margin:0 0 4px;}
  #reportView .r-meta{font-size:12px;color:#555;line-height:1.5;}
  #reportView .r-series{border:1px solid #d5d9de;border-radius:10px;padding:14px;margin-bottom:16px;break-inside:avoid;page-break-inside:avoid;}
  #reportView .r-series h3{font-family:'Oswald',sans-serif;font-size:15px;text-transform:uppercase;letter-spacing:.05em;margin:0 0 4px;color:#00611c;}
  #reportView .r-fam{font-size:12px;color:#555;margin-bottom:10px;}
  #reportView .r-kv{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px;}
  #reportView .r-kv div{background:#f4f5f7;border-radius:8px;padding:8px 10px;}
  #reportView .r-kv b{display:block;font-size:15px;font-family:'Roboto Mono',monospace;font-weight:500;}
  #reportView .r-kv span{font-size:10.5px;color:#555;}
  #reportView .r-sub{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:#555;margin:0 0 6px;}
  #reportView table{width:100%;border-collapse:collapse;font-size:12.5px;}
  #reportView th,#reportView td{padding:6px 8px;border-bottom:1px solid #e3e6ea;text-align:left;vertical-align:middle;}
  #reportView th{font-size:11px;color:#555;font-weight:600;}
  #reportView .num{text-align:right;font-family:'Roboto Mono',monospace;}
  #reportView tfoot td{font-weight:700;border-bottom:none;}
  #reportView .r-sw{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;border:1px solid rgba(0,0,0,.3);}
  #reportView .r-press{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px;padding:10px 14px;border-radius:8px;border:2px solid;}
  #reportView .r-press span{font-size:13px;font-weight:600;}
  #reportView .r-press b{font-family:'Oswald',sans-serif;font-size:26px;}
  #reportView .r-warn{font-size:11.5px;margin-top:6px;color:#b45309;}
  #reportView .r-foot{font-size:10.5px;color:#666;margin-top:6px;border-top:1px solid #ddd;padding-top:8px;line-height:1.5;}
  @media (max-width:520px){#reportView .r-kv{grid-template-columns:repeat(2,1fr);}#reportView .r-head{flex-direction:column;align-items:flex-start;}}
  @media print{
    body > *:not(#reportView){display:none !important;}
    #reportView{position:static;overflow:visible;}
    #reportView .r-bar{display:none;}
    #reportView .r-page{padding:0;max-width:none;}
    #reportView *{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
    @page{margin:12mm;}
  }

  /* ===== Layout responsive =====
     Mobile/tablet: colonna singola (max 720px, centrata).
     Desktop (>=1100px): schermo intero, contenuti in colonne affiancate, senza scorrere. */
  .app-head,.layout{width:100%;max-width:720px;margin:0 auto;}
  @media (min-width:1100px){
    .app-head{max-width:1900px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:8px 24px;border-bottom:1px solid var(--line);}
    .settings-bar{display:contents;}
    .lang-toggle{grid-column:1;grid-row:1;justify-self:start;}
    .theme-btn{grid-column:3;grid-row:1;justify-self:end;}
    .head-center{grid-column:2;grid-row:1;display:flex;align-items:center;gap:22px;}
    .head-center .logo-wrap{padding:4px 0;}
    .head-center .logo-wrap img{max-width:150px;}
    .head-center .topbar{padding:0;border-bottom:none;}
    .layout{max-width:1900px;padding:0 24px 20px;}
    .layout .section{padding:12px 0 0;}
    .card{padding:16px;margin-bottom:12px;}
    body{padding-bottom:0;}
  }
  /* menu a tendina coerenti su tutti i browser (desktop incluso) */
  .cfg-select{
    appearance:none;-webkit-appearance:none;-moz-appearance:none;cursor:pointer;padding-right:36px;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%239aa1ab' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");
    background-repeat:no-repeat;background-position:right 12px center;
    text-overflow:ellipsis;white-space:nowrap;overflow:hidden;
  }
  .cfg-select option,.cfg-select optgroup{background:var(--panel);color:var(--text);font-family:'Inter',sans-serif;font-size:14px;}
  .cfg-select optgroup{font-weight:700;font-style:normal;}
  @media (hover:hover){
    .cfg-btn:hover,.seg-btn:hover,.alt:hover,.fam:hover,.series-btn:hover,.lang-btn:hover,.theme-btn:hover,.cfg-select:hover{border-color:var(--accent);}
    .cfg-btn.primary:hover,.seg-btn.active:hover{filter:brightness(1.1);}
  }
  button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

  /* ===== Finestra di conferma interna (al posto di confirm(), bloccato in anteprime/iframe) ===== */
  .dlg-ov{position:fixed;inset:0;z-index:2000;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:20px;}
  .dlg{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:14px;padding:20px;max-width:380px;width:100%;box-shadow:0 12px 40px rgba(0,0,0,.45);}
  .dlg-msg{font-size:14.5px;line-height:1.5;margin-bottom:18px;word-break:break-word;}
  .dlg-btns{display:flex;gap:10px;justify-content:flex-end;}
  .dlg-btns .cfg-btn{min-width:96px;}
  .cfg-btn:disabled{opacity:.4;cursor:not-allowed;}

  /* ===== Campo aperto ===== */
  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;}
  .two-col .field{margin-bottom:0;}
  .two-col .field .u{min-width:30px;}
  .seg{display:flex;gap:8px;}
  .seg-btn{flex:1;padding:11px 8px;border-radius:10px;border:1px solid var(--line);background:var(--panel-2);color:var(--text-dim);font-family:'Inter',sans-serif;font-size:15px;font-weight:700;cursor:pointer;}
  .seg-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;}
  .hint{font-size:11.5px;color:var(--text-dim);line-height:1.5;margin-top:8px;}
  .rec{background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:12px;}
  .rec-top{display:flex;align-items:center;gap:10px;}
  .sw{width:22px;height:22px;border-radius:50%;border:1px solid rgba(128,128,128,.55);flex-shrink:0;display:inline-block;}
  .rec-info{flex:1;min-width:0;}
  .rec-code{font-family:'Roboto Mono',monospace;font-size:15px;font-weight:500;}
  .rec-code small{font-family:'Inter',sans-serif;font-size:10.5px;color:var(--text-dim);}
  .rec-sub{font-size:11px;color:var(--text-dim);margin-top:2px;}
  .rec-sub b{color:var(--text);}
  .rec-p{font-family:'Oswald',sans-serif;font-size:34px;font-weight:700;line-height:1;text-align:right;}
  .rec-p small{display:block;font-family:'Inter',sans-serif;font-size:10.5px;font-weight:500;color:var(--text-dim);letter-spacing:.08em;text-transform:uppercase;}
  .pbar{position:relative;height:10px;border-radius:5px;margin:16px 0 4px;background:linear-gradient(90deg,#e07a2f 0 20%,#e0b020 20% 40%,#2e9f4f 40% 60%,#e0b020 60% 80%,#e07a2f 80% 100%);}
  .pmark{position:absolute;top:-5px;width:4px;height:20px;border-radius:2px;background:var(--text);box-shadow:0 0 0 2px var(--panel-2);transform:translateX(-50%);}
  .pscale{display:flex;justify-content:space-between;font-size:10px;color:var(--text-dim);font-family:'Roboto Mono',monospace;}
  .badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
  .badge{font-size:11px;font-weight:600;padding:4px 9px;border-radius:999px;border:1px solid var(--line);background:var(--panel);}
  .advice{font-size:12px;line-height:1.5;margin-top:10px;}
  .vwin{font-size:12px;color:var(--text-dim);margin-top:6px;}
  .alts-title{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-dim);margin:12px 0 6px;}
  .alt{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--text);font-family:'Inter',sans-serif;cursor:pointer;margin-bottom:6px;text-align:left;}
  .alt.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset;}
  .alt .sw{width:16px;height:16px;}
  .alt .a-code{font-family:'Roboto Mono',monospace;font-size:13px;flex:1;}
  .alt .a-p{font-family:'Roboto Mono',monospace;font-size:13px;}
  .alt .a-d{font-size:11px;color:var(--text-dim);min-width:24px;text-align:right;}
  .star{color:#e0b020;}
  .warnbox{font-size:12.5px;line-height:1.6;color:#e0a030;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;}
  .xrow{margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid var(--line);}
  .xrow label{display:block;font-size:12.5px;color:var(--text-dim);margin-bottom:6px;}
  .xrow input[type=number]{flex:1;background:var(--panel-2);border:1px solid var(--line);border-radius:9px;color:var(--text);font-family:'Roboto Mono',monospace;font-size:17px;font-weight:500;padding:11px 12px;width:100%;outline:none;}
  .xrow input[type=number]:focus{border-color:var(--accent);}
  .xdel{background:transparent;border:1px solid var(--line);color:var(--text-dim);border-radius:8px;width:38px;height:42px;font-size:20px;cursor:pointer;flex-shrink:0;}
  .xres{margin-top:8px;font-size:12.5px;line-height:1.6;}
  .xres .big{font-family:'Roboto Mono',monospace;font-size:14.5px;font-weight:500;}
  .plan{margin-top:14px;padding:12px;border:1px solid var(--accent);border-radius:12px;background:var(--panel-2);font-size:12.5px;line-height:1.55;}
  .plan .pl{margin-top:6px;}
  .xrow .input-row{display:flex;align-items:center;gap:8px;}
  .xrow .u{font-size:12px;color:var(--text-dim);min-width:30px;}
  .alts .alt:last-child{margin-bottom:6px;}
  /* tipo di trattamento e tipologia di ugello */
  .tr-field{margin-bottom:12px;}
  .tr-seg{gap:6px;}
  .tr-seg .seg-btn{font-size:12px;font-weight:600;padding:9px 4px;line-height:1.2;}
  .fams{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:6px;}
  .fam{display:flex;flex-direction:column;gap:2px;text-align:left;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--text);font-family:'Inter',sans-serif;cursor:pointer;min-width:0;}
  .fam b{font-family:'Roboto Mono',monospace;font-size:13px;font-weight:500;}
  .fam > span{font-size:10.5px;color:var(--text-dim);line-height:1.3;}
  .fam.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset;}
  .rec-fam{font-size:11.5px;margin-top:2px;line-height:1.35;}
  .badge .sw{width:10px;height:10px;vertical-align:-1px;margin-right:4px;}
  .fam > span strong{color:var(--text);font-weight:700;}
  .fert{font-size:11.5px;line-height:1.5;color:var(--text-dim);margin-top:8px;}
  /* pulsante "i" e scheda ugello */
  .fam{position:relative;padding-right:30px;}
  .ibtn{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;flex-shrink:0;
    border:1.5px solid var(--accent);color:var(--accent);background:var(--panel);font:italic 700 12.5px Georgia,serif;cursor:pointer;vertical-align:middle;}
  .fam .ibtn{position:absolute;top:6px;right:6px;}
  .alt .ibtn{margin-left:2px;}
  .ibtn:active{opacity:.7;}
  @media (min-width:1100px){
    #setsHost .alts .alt{grid-template-columns:auto 1fr auto auto;grid-template-areas:"sw code code i" "sw p d i";}
    #setsHost .alts .alt .ibtn{grid-area:i;}
  }
  .ni-ov{position:fixed;inset:0;z-index:2500;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:14px;}
  .ni{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:16px;max-width:440px;width:100%;max-height:calc(100vh - 28px);overflow:auto;
    box-shadow:0 14px 44px rgba(0,0,0,.5);padding:16px;}
  .ni-head{display:flex;align-items:flex-start;gap:10px;}
  .ni-head h3{margin:0;font-family:'Oswald',sans-serif;font-size:19px;font-weight:600;letter-spacing:.02em;}
  .ni-head p{margin:2px 0 0;font-size:12.5px;color:var(--text-dim);line-height:1.4;}
  .ni-x{margin-left:auto;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--panel-2);color:var(--text);font-size:18px;cursor:pointer;flex-shrink:0;}
  .ni-icon{background:var(--panel-2);border:1px solid var(--line);border-radius:12px;margin:12px 0 4px;padding:6px;}
  .ni-icon svg{display:block;width:100%;height:auto;max-height:150px;}
  .ni-cap{font-size:11px;color:var(--text-dim);text-align:center;margin-bottom:10px;}
  .ni-sel{font-size:12.5px;background:var(--panel-2);border-radius:10px;padding:8px 10px;margin-bottom:10px;display:flex;align-items:center;gap:8px;}
  .ni-grid{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:12.5px;align-items:center;}
  .ni-grid .g{grid-column:1 / -1;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text-dim);margin-top:6px;}
  .rt{font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:6px;text-align:center;min-width:92px;letter-spacing:.02em;}
  .rt.E{background:#0096d6;color:#fff;} .rt.MB{background:#7ac143;color:#10200a;} .rt.B{background:#ffd400;color:#2a2400;} .rt.N{background:var(--panel-2);color:var(--text-dim);}
  .ni-facts{font-size:12px;line-height:1.55;margin-top:10px;color:var(--text-dim);}
  .ni-facts b{color:var(--text);}
  .ni-note{font-size:12.5px;line-height:1.5;margin-top:10px;padding:8px 10px;border-left:3px solid var(--accent);background:var(--panel-2);border-radius:6px;}
  .ni-src{font-size:10.5px;color:var(--text-dim);margin-top:10px;}

  /* layout campo aperto: mobile = colonna; desktop = fascia dati macchina + preset a sinistra + set affiancati */
  .layout{display:block;}
  #spCustomRow{margin-top:8px;}
  .side-foot{display:block;}
  @media (min-width:1100px){
    .layout{display:grid;grid-template-columns:minmax(320px,360px) minmax(0,1fr);
            grid-template-areas:"machine machine" "cfg main" "foot foot";gap:0 24px;align-items:start;}
    #secMachine{grid-area:machine;} #secCfg{grid-area:cfg;} #mainArea{grid-area:main;} .side-foot{grid-area:foot;}
    #secMachine .card{display:grid;grid-template-columns:1fr 1fr 1.4fr;gap:20px;align-items:start;margin-bottom:0;}
    #secMachine .field{margin:0;}
    .sp-wrap{display:flex;gap:10px;align-items:center;}
    .sp-wrap .seg{flex:1;}
    #spCustomRow{margin-top:0;width:140px;flex-shrink:0;}
    #mainArea{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:0 16px;align-items:start;}
    #setsHost{display:contents;}
    #extraSection{grid-column:span 2;}
    .alts{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
    .alts .alt,.alts .alt:last-child{margin-bottom:0;}
    .xrow{display:grid;grid-template-columns:minmax(170px,230px) 1fr;column-gap:18px;align-items:center;}
    .xrow label{grid-column:1;}
    .xrow .input-row{grid-column:1;}
    .xrow .xres{grid-column:2;grid-row:1 / 3;margin:0;}
    .side-foot{display:flex;align-items:center;gap:24px;padding-top:8px;}
    .side-foot .footer-note{padding:0;flex:1;font-size:11px;}
    .side-foot .reset-btn{margin:0;width:220px;flex-shrink:0;}
    .alts .alt{display:grid;grid-template-columns:auto 1fr auto;grid-template-areas:"sw code code" "sw p d";column-gap:8px;row-gap:1px;padding:7px 9px;min-width:0;align-items:center;}
    .alts .alt .sw{grid-area:sw;}
    .alts .a-code{grid-area:code;font-size:12px;flex:none;white-space:nowrap;}
    .alts .a-p{grid-area:p;font-size:12px;white-space:nowrap;}
    .alts .a-d{grid-area:d;}
    .layout .section{padding-top:8px;}
    #extraHint{display:none;}
    .xrow{margin-bottom:8px;padding-bottom:8px;}
    #secMachine .hint{margin-top:6px;}
  }
</style>
</head>

<script>
// =====================================================================
// SCELTA UGELLI - CAMPO APERTO (TeeJet: tipologia per trattamento + misura ISO)
// Dati: scheda applicazione TeeJet AIXR (acqua a 21 °C, ISO 25358).
// l/ha = l/min × 600 / (km/h × interasse[m])
// =====================================================================
const P_MIN = 1, P_MAX = 6;          // range di lavoro pompa (bar)
const P_OPT_LO = 3, P_OPT_HI = 4;    // zona ideale
const P_ACC_LO = 2, P_ACC_HI = 5;    // zona accettabile
const P_TARGET = 3.5;                // pressione "ideale" usata per ordinare le scelte

// q = portata per ugello (l/min) a 1,2,3,4,5,6 bar; drop = classe goccia a 1..6 bar (dalla scheda)
const NOZZLES = [
  {id:'110015', code:'AIXR110015', variants:'VP/VK', color:'#2e9f4f', mesh:100, q:[0.34,0.48,0.59,0.68,0.76,0.83], drop:['C','C','C','M','M','M']},
  {id:'11002',  code:'AIXR11002',  variants:'VP/VK', color:'#f2c94c', mesh:50,  q:[0.46,0.65,0.79,0.91,1.02,1.12], drop:['VC','VC','C','M','M','M']},

  {id:'11003',  code:'AIXR11003',  variants:'VP/VK', color:'#2f80ed', mesh:50,  q:[0.68,0.96,1.18,1.36,1.52,1.67], drop:['VC','VC','C','M','M','M']},
  {id:'11004',  code:'AIXR11004',  variants:'VP/VK', color:'#eb5757', mesh:50,  q:[0.91,1.29,1.58,1.82,2.04,2.23], drop:['VC','VC','C','C','M','M']},
  {id:'11005',  code:'AIXR11005',  variants:'VP/VK', color:'#8b5a2b', mesh:50,  q:[1.14,1.61,1.97,2.27,2.54,2.79], drop:['VC','VC','VC','C','C','M']},
  {id:'11006',  code:'AIXR11006',  variants:'VP/VK', color:'#8e9399', mesh:50,  q:[1.37,1.94,2.37,2.74,3.06,3.35], drop:['XC','VC','VC','C','C','C']},
  {id:'11008',  code:'AIXR11008',  variants:'VP',    color:'#ffffff', mesh:50,  q:[1.82,2.58,3.16,3.65,4.08,4.47], drop:['XC','XC','VC','VC','C','C']},
  {id:'11010',  code:'AIXR11010',  variants:'VP',    color:'#29a3e0', mesh:0,   q:[2.28,3.23,3.95,4.56,5.10,5.59], drop:['UC','UC','UC','XC','XC','VC']}

// Coefficiente k (Q = k·√P) ricavato dai 6 punti della scheda (minimi quadrati)
NOZZLES.forEach(n => {
  n.k = n.q.reduce((a, v, i) => a + v * Math.sqrt(i + 1), 0) / n.q.reduce((a, _, i) => a + (i + 1), 0);
});

// ---------------------------------------------------------------------
// TIPOLOGIE DI UGELLO TeeJet E TRATTAMENTI
// La portata dipende solo dalla misura ISO (colore): la tabella NOZZLES qui sopra vale per tutte le tipologie.
// Ogni tipologia ha le sue misure disponibili e il suo campo di pressione (da catalogo TeeJet).
// optLo/optHi/accLo/accHi/pTarget: zona ideale/accettabile, se diversa da quella generale (3–4 / 2–5 bar).
// VALORI DA VALIDARE a cura del reparto tecnico: per modificarli basta cambiare questa tabella.
// ---------------------------------------------------------------------
const CAP_COLOR = {'0050':'#c4b5fd','0067':'#7a7a32','01':'#f4820f','015':'#2e9f4f','02':'#f2c94c','025':'#a78bda','03':'#2f80ed','04':'#eb5757','05':'#8b5a2b','06':'#8e9399','08':'#ffffff','10':'#29a3e0','15':'#7ed37a'};
const CAP_NAME  = {'0050':'lilac','0067':'olive','01':'orange','015':'green','02':'yellow','025':'lilac','03':'blue','04':'red','05':'brown','06':'grey','08':'white','10':'lightblue','15':'lightgreen'};

// Dati dal catalogo TeeJet 51A-IT (ugelli per irrorazione a pieno campo): pressioni (bar), portata per ugello (l/min, acqua) e classe di goccia.
// AIXR usa la tabella NOZZLES qui sopra (invariata). Per TwinJet e XR la goccia è quella della versione 110°.
const P6 = [1,2,3,4,5,6], P15 = [1.5,2,3,4,5,6], P26 = [2,3,4,5,6], PXR = [1,1.5,2,2.5,3,4], PTJ = [2,2.5,3,3.5,4], PSJ = [1.5,2,2.5,3,4];
const ISOQ = { '01':[0.23,0.32,0.39,0.45,0.51,0.56], '015':[0.34,0.48,0.59,0.68,0.76,0.83], '02':[0.46,0.65,0.79,0.91,1.02,1.12], '025':[0.57,0.81,0.99,1.14,1.28,1.40],
  '03':[0.68,0.96,1.18,1.36,1.52,1.67], '04':[0.91,1.29,1.58,1.82,2.04,2.23], '05':[1.14,1.61,1.97,2.27,2.54,2.79], '06':[1.37,1.94,2.37,2.74,3.06,3.35],
  '08':[1.82,2.58,3.16,3.65,4.08,4.47], '10':[2.28,3.23,3.95,4.56,5.10,5.59] };   // portata ISO a 1–6 bar
const isoAt = (cap, ps) => ps.map(p => +(ISOQ[cap][0] * Math.sqrt(p)).toFixed(3));
const FAMDATA = {
  AI:      { p:P26, d:{ '015':'UC XC XC VC VC', '02':'UC XC XC VC VC', '025':'UC XC XC VC VC', '03':'UC XC XC VC VC', '04':'UC XC XC VC VC', '05':'UC XC XC VC VC', '06':'UC XC XC XC VC', '08':'UC UC XC XC VC', '10':'UC UC XC XC VC' } },

const FAMILIES = {
  AIXR:    { id:'AIXR',    name:'AIXR',          pMin:1,   pMax:6, code:c => 'AIXR110' + c, variants:'VP/VK', spray:'fan',  rate:'MB B E B E B E E –' },
  AI:      { id:'AI',      name:'AI',            pMin:2,   pMax:6, code:c => 'AI110' + c,   variants:'VS/VP', spray:'fanAI', rate:'MB B E B E B E E –', pTarget:4, optLo:3, optHi:5, accLo:2, accHi:6 },

  AITTJ60: { id:'AITTJ60', name:'AITTJ60',       pMin:1.5, pMax:6, code:c => 'AITTJ60-110' + c, variants:'VP', spray:'twinAI', rate:'MB B E B E B E E –' },
  AI3070:  { id:'AI3070',  name:'AI3070',        pMin:1.5, pMax:6, code:c => 'AI3070-' + c, variants:'VP', spray:'a3070', rate:'– MB MB E MB E MB E –' },

  TXB:     { id:'TXB',     name:'TXB ConeJet',   pMin:2,   pMax:6, code:c => 'TXB80' + c + 'VK', variants:'VK', spray:'cone', rate:'– E B E B E B – –', pTarget:4.5, optLo:3, optHi:6, accLo:2, accHi:6 },
  SJ7:     { id:'SJ7',     name:'StreamJet SJ7', pMin:1.5, pMax:4, code:c => 'SJ7-' + c, variants:'VP', streams:true, spray:'streams', rate:'', pTarget:2.5, optLo:2, optHi:3, accLo:1.5, accHi:4 }

const TREATMENTS = { diserbo:['AIXR','AI','XR','AITTJ60'], fungins:['AITTJ60','AI3070','TXB','TJ60'], concime:['SJ7'] };
const TREAT_IDS = ['diserbo','fungins','concime'], TREAT_DEF = 'diserbo';
const FAM_NOZZLES = {};
Object.keys(FAMILIES).forEach(fid => {
  const f = FAMILIES[fid];
  if (fid === 'AIXR') {   // tabella originale, invariata
    FAM_NOZZLES[fid] = NOZZLES.map(n => Object.assign({}, n, { fam:fid, cap:capOf(n.id), dp:P6, dd:n.drop, qp:n.q }));
    return;
  }
  const D = FAMDATA[fid], caps = Object.keys(D.q || D.d);
  FAM_NOZZLES[fid] = caps.map(cap => {
    const qp = D.q ? D.q[cap] : isoAt(cap, D.p);
    const k = qp.reduce((a, q, i) => a + q * Math.sqrt(D.p[i]), 0) / D.p.reduce((a, p) => a + p, 0);
    return { id:'110' + cap, cap, fam:fid, code:f.code(cap), variants:f.variants, color:CAP_COLOR[cap],
             mesh:['0050','0067','01','015'].includes(cap) ? 100 : 50, k, dp:D.p, qp, dd:D.d ? D.d[cap].split(' ') : null, drop:true };
  });
});
// ordina dalla portata più piccola alla più grande (serve per gli avvisi e per il piano dosaggi)
Object.values(FAM_NOZZLES).forEach(l => l.sort((a, b) => a.k - b.k));
function treatOf(set){ return TREATMENTS[set.treat] ? set.treat : TREAT_DEF; }
function famOf(set){ const list = TREATMENTS[treatOf(set)]; return FAMILIES[list.includes(set.fam) ? set.fam : list[0]]; }
function zonesOf(f){
  return { lo:Math.max(P_MIN, f.pMin), hi:Math.min(P_MAX, f.pMax), optLo:f.optLo || P_OPT_LO, optHi:f.optHi || P_OPT_HI,
           accLo:f.accLo || P_ACC_LO, accHi:f.accHi || P_ACC_HI, target:f.pTarget || P_TARGET };
}
function zonesN(n){ return zonesOf(FAMILIES[n.fam] || FAMILIES.AIXR); }
function blankSet(){ return { lha:0, vel:0, nozzle:null, treat:TREAT_DEF, fam:null }; }

function askConfirm(message, okLabel, cancelLabel){
  return new Promise(resolve => {
    const ov = document.createElement('div'); ov.className = 'dlg-ov';
    ov.innerHTML = '<div class="dlg" role="dialog" aria-modal="true"><div class="dlg-msg"></div><div class="dlg-btns">' +
      '<button type="button" class="cfg-btn" data-r="0"></button><button type="button" class="cfg-btn danger" data-r="1"></button></div></div>';
    ov.querySelector('.dlg-msg').textContent = message;
    const [bNo, bYes] = ov.querySelectorAll('button');
    bNo.textContent = cancelLabel; bYes.textContent = okLabel;
    const done = v => { document.removeEventListener('keydown', onKey); ov.remove(); resolve(v); };
    const onKey = e => { if (e.key === 'Escape') done(false); };
    bNo.addEventListener('click', () => done(false));
    bYes.addEventListener('click', () => done(true));
    ov.addEventListener('click', e => { if (e.target === ov) done(false); });
    document.addEventListener('keydown', onKey);
    document.body.appendChild(ov);
    bNo.focus();
  });
}

function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
const $ = id => document.getElementById(id);

// ---------------------------------------------------------------------
// Calcolo
// ---------------------------------------------------------------------
function pressureFor(n, Q){ return Math.pow(Q / n.k, 2); }
function flowAt(n, P){ return n.k * Math.sqrt(P); }
function zoneOf(P, f){
  const z = zonesOf(f || FAMILIES.AIXR);
  if (P < z.lo - 1e-9 || P > z.hi + 1e-9) return 'out';
  if (P >= z.optLo && P <= z.optHi) return 'opt';
  if (P >= z.accLo && P <= z.accHi) return 'ok';
  return 'edge';
}
function dropAt(n, P){
  if (!n.dd) return '';
  let b = 0; n.dp.forEach((p, i) => { if (Math.abs(p - P) < Math.abs(n.dp[b] - P)) b = i; });
  return n.dd[b];
}
// testi con "3–4" (zona ideale) e "AIXR" adattati alla tipologia scelta
function famText(str, f){ const z = zonesOf(f); return String(str).replace('3–4', `${z.optLo}–${z.optHi}`).replace('AIXR', f.name); }
function pbarBg(f){
  const z = zonesOf(f), p = x => Math.min(100, Math.max(0, (x - P_MIN) / (P_MAX - P_MIN) * 100)).toFixed(1) + '%';
  return `linear-gradient(90deg,#8a8f98 0 ${p(z.lo)},#e07a2f ${p(z.lo)} ${p(z.accLo)},#e0b020 ${p(z.accLo)} ${p(z.optLo)},#2e9f4f ${p(z.optLo)} ${p(z.optHi)},#e0b020 ${p(z.optHi)} ${p(z.accHi)},#e07a2f ${p(z.accHi)} ${p(z.hi)},#8a8f98 ${p(z.hi)} 100%)`;
}
function fmt(v, d){ return Number(v).toFixed(d); }

// spacingCm: interasse; set: {lha, vel, nozzle}
function evaluate(spacingCm, set){
  const s = spacingCm / 100;
  if (!(set.lha > 0 && set.vel > 0 && s > 0)) return { ready:false, fam:famOf(set) };
  const Q = set.lha * set.vel * s / 600;               // l/min per ugello
  const fam = famOf(set), list = FAM_NOZZLES[fam.id], z = zonesOf(fam);   // misure e pressioni della tipologia scelta
  const cands = list.map(n => ({ n, P: pressureFor(n, Q) }))
    .filter(c => c.P >= z.lo - 1e-9 && c.P <= z.hi + 1e-9)
    .sort((a, b) => Math.abs(a.P - z.target) - Math.abs(b.P - z.target));
  const best = cands[0] || null;
  let sel = null;
  if (set.nozzle) {
    const n = list.find(x => x.id === set.nozzle);
    if (n) { const P = pressureFor(n, Q); if (P >= z.lo - 1e-9 && P <= z.hi + 1e-9) sel = { n, P }; }
  }
  if (!sel) sel = best;
  return { ready:true, Q, s, cands, best, sel, fam, list };
}

// Stato e interfaccia
// ---------------------------------------------------------------------
const state = { spacing:50, nSets:1, vmin:V_MIN_DEF, vmax:V_MAX_DEF, extra:[], sets:[0,1,2,3].map(blankSet) };
const setsHost = $('setsHost');
const spacingEl = $('spacingCm');
let spMode = '50';   // '50' | '25' | 'custom'
function currentSpacing(){ return spMode === '50' ? 50 : spMode === '25' ? 25 : Math.max(0, parseFloat(spacingEl.value) || 0); }
function setSpacingMode(m){
  spMode = m;
  $('sp50').classList.toggle('active', m === '50');
  $('sp25').classList.toggle('active', m === '25');
  $('spOther').classList.toggle('active', m === 'custom');
  $('spCustomRow').style.display = m === 'custom' ? '' : 'none';
}
function setSpacingUI(v){
  if (v === 50) setSpacingMode('50');
  else if (v === 25) setSpacingMode('25');
  else { setSpacingMode('custom'); spacingEl.value = v > 0 ? v : ''; }
}

function buildSets(){
  setsHost.innerHTML = '';
  for (let i = 0; i < 4; i++) {
    const sec = document.createElement('div');
    sec.className = 'section'; sec.id = 'setSec' + i;
    sec.innerHTML = `<h2 id="setTitle${i}"></h2><div class="card">
      <div class="field tr-field"><label id="lblTreat${i}"></label><div class="seg tr-seg" id="treatSeg${i}">${
        TREAT_IDS.map(t => `<button type="button" class="seg-btn" data-set="${i}" data-treat="${t}"></button>`).join('')}</div></div>
      <div class="two-col">
        <div class="field"><label id="lblLha${i}"></label><div class="input-row"><input type="number" id="lha${i}" inputmode="decimal" placeholder="0" value="0" min="0"><span class="u">l/ha</span></div></div>
        <div class="field"><label id="lblVel${i}"></label><div class="input-row"><input type="number" id="vel${i}" inputmode="decimal" placeholder="0" value="0" min="0"><span class="u">km/h</span></div></div>
      </div>
      <div id="res${i}"></div></div>`;
    setsHost.appendChild(sec);
    $('lha' + i).addEventListener('input', e => { state.sets[i].lha = Math.max(0, parseFloat(e.target.value) || 0); recalc(); });
    $('vel' + i).addEventListener('input', e => { state.sets[i].vel = Math.max(0, parseFloat(e.target.value) || 0); recalc(); });
  }
}

function setBadge(text, color){
  return `<span class="badge" style="border-color:${color};color:${color}">${esc(text)}</span>`;
}

function ibtn(fid, nz, P){
  return `<span class="ibtn" role="button" tabindex="0" aria-label="${esc(T('info'))}" data-fam="${fid}"${nz ? ` data-nz="${nz}"` : ''}${P ? ` data-p="${P}"` : ''}>i</span>`;

// Disegno laterale del getto: avanzamento verso destra, ugello in alto
function sprayIcon(kind){
  const W = 240, H = 150, nx = 150, ny = 22, gy = 128;
  let s = `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">`;
  s += `<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="currentColor"/></marker></defs>`;
  s += `<line x1="18" y1="14" x2="92" y2="14" stroke="currentColor" stroke-width="2" marker-end="url(#ah)" style="color:var(--text-dim)"/>`;
  s += `<text x="18" y="30" font-size="10" fill="var(--text-dim)" font-family="Inter,sans-serif">${esc(T('travel'))}</text>`;
  // coltura
  for (let x = 12; x < W - 8; x += 9) {
    const h = 26 + ((x * 7) % 11);
    s += `<path d="M${x},${gy} q2,-${h / 2} ${(x % 2 ? 4 : -3)},-${h}" stroke="#4caf50" stroke-width="2" fill="none" opacity=".85"/>`;
  }
  s += `<rect x="0" y="${gy}" width="${W}" height="${H - gy}" fill="#6b4a2b"/>`;
  let seed = 7; const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
  const fan = (deg, half, drops, rMin, rMax, op, hollow) => {
    const a = deg * Math.PI / 180, h = half * Math.PI / 180, L = Math.min((gy - ny) / Math.cos(a), 205);
    const p1 = [nx + L * Math.sin(a - h), ny + L * Math.cos(a - h)], p2 = [nx + L * Math.sin(a + h), ny + L * Math.cos(a + h)];
    let o = hollow ? `<path d="M${nx},${ny} L${p1[0]},${p1[1]} M${nx},${ny} L${p2[0]},${p2[1]}" stroke="#3aa0e6" stroke-width="5" opacity=".75"/>`
                     + `<ellipse cx="${(p1[0] + p2[0]) / 2}" cy="${gy - 2}" rx="${Math.abs(p2[0] - p1[0]) / 2}" ry="6" fill="none" stroke="#3aa0e6" stroke-width="3" opacity=".7"/>`
                   : `<polygon points="${nx},${ny} ${p1[0]},${p1[1]} ${p2[0]},${p2[1]}" fill="#3aa0e6" opacity="${op}"/>`;
    for (let i = 0; i < drops; i++) {
      const t = 0.25 + 0.75 * rnd(), u = hollow ? (rnd() < .5 ? -1 : 1) * (0.75 + 0.25 * rnd()) : (rnd() * 2 - 1);
      const aa = a + u * h * 0.95, x = nx + t * L * Math.sin(aa), y = ny + t * L * Math.cos(aa);
      if (y > gy - 2) continue;
      const r = rMin + (rMax - rMin) * rnd();
      o += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r.toFixed(1)}" fill="#1d6fb8"/>`;
      if (rMax >= 2.5 && r > 2) o += `<circle cx="${(x - r * .3).toFixed(1)}" cy="${(y - r * .3).toFixed(1)}" r="${(r * .35).toFixed(1)}" fill="#fff" opacity=".85"/>`;
    }
    return o;
  };
  const K = {
    fan:     () => fan(0, 12, 26, 1.6, 2.8, .35),
    fanAI:   () => fan(0, 12, 22, 2.2, 3.4, .32),
    fanFine: () => fan(0, 13, 70, 0.7, 1.3, .45),
    twin:    () => fan(30, 9, 34, 0.7, 1.4, .42) + fan(-30, 9, 34, 0.7, 1.4, .42),
    twinAI:  () => fan(30, 9, 16, 2, 3.2, .32) + fan(-30, 9, 16, 2, 3.2, .32),
    a3070:   () => fan(30, 8, 12, 1.8, 3, .32) + fan(-70, 6, 20, 1.8, 3, .32),
    cone:    () => fan(0, 30, 70, 0.6, 1.1, 0, true),
    streams: () => { let o = ''; for (let i = -3; i <= 3; i++) { const a = i * 11 * Math.PI / 180, L = (gy - ny) / Math.cos(a);
                       o += `<line x1="${nx}" y1="${ny}" x2="${nx + L * Math.sin(a)}" y2="${gy}" stroke="#3aa0e6" stroke-width="3" stroke-linecap="round"/>`; } return o; }
  };
  s += (K[kind] || K.fan)();
  s += `<rect x="${nx - 7}" y="${ny - 16}" width="14" height="14" rx="3" fill="#c62828"/><path d="M${nx - 5},${ny - 3} h10 l-2,5 h-6 z" fill="#8e1c1c"/>`;
  return s + '</svg>';
}
function rateCell(r){
  const cls = r === 'E' ? 'E' : r === 'MB' ? 'MB' : r === 'B' ? 'B' : 'N';
  return `<span class="rt ${cls}">${esc(T('r' + cls))}</span>`;
}
function openNozzleInfo(fid, nzId, P){
  const f = FAMILIES[fid]; if (!f) return;
  closeNozzleInfo();
  const list = FAM_NOZZLES[fid], n = nzId ? list.find(x => x.id === nzId) : null;
  const z = zonesOf(f), caps = list.map(x => x.cap).join(' · ');
  const ds = [...new Set(list.flatMap(x => x.dd || []))], order = ['XF','VF','F','M','C','VC','XC','UC'];
  ds.sort((a, b) => order.indexOf(a) - order.indexOf(b));
  let body = '';
  if (f.rate) {
    const r = f.rate.split(' ');
    const row = (lbl, v) => `<span>${esc(lbl)}</span>${rateCell(v)}`;
    body = `<div class="ni-grid">
      <div class="g">${esc(T('gHerb'))}</div>${row(T('cSoil'), r[0])}${row(T('cCont'), r[1])}${row(T('cSys'), r[2])}
      <div class="g">${esc(T('gFung'))}</div>${row(T('cCont'), r[3])}${row(T('cSys'), r[4])}
      <div class="g">${esc(T('gIns'))}</div>${row(T('cCont'), r[5])}${row(T('cSys'), r[6])}
      <div class="g">${esc(T('gOther'))}</div>${row(T('cDrift'), r[7])}${row(T('cPwm'), r[8])}</div>`;
  }
  const sel = n ? `<div class="ni-sel"><span class="sw" style="background:${n.color}"></span><b>${esc(n.code)}</b> · ${esc(colorName(n))}${P ? ` · ${fmt(P, 1)} bar · ${esc(dropText(n, P))}` : ''}</div>` : '';
  const src = fid === 'TXB' ? T('srcTXB') : fid === 'SJ7' ? T('srcSJ7') : T('src');
  const ov = document.createElement('div'); ov.className = 'ni-ov'; ov.id = 'niOv';
  ov.innerHTML = `<div class="ni" role="dialog" aria-modal="true">
    <div class="ni-head"><div><h3>TeeJet ${esc(f.name)}</h3><p>${esc(T('famDesc')[fid])}</p></div><button type="button" class="ni-x" aria-label="×">×</button></div>
    <div class="ni-icon">${sprayIcon(f.spray)}</div>
    ${sel}
    <div class="ni-note">${esc(T('notes')[fid])}</div>
    ${f.rate ? `<div class="alts-title" style="margin-top:12px">${esc(T('rTitle'))}</div>` + body : ''}
    <div class="ni-facts"><b>${esc(T('range'))}:</b> ${String(z.lo).replace('.', ',')}–${String(z.hi).replace('.', ',')} bar (${esc(T('zoneOpt').toLowerCase())} ${String(z.optLo).replace('.', ',')}–${String(z.optHi).replace('.', ',')})<br>
      ${ds.length ? `<b>${esc(T('drops'))}:</b> ${ds.join(' – ')}<br>` : ''}<b>${esc(T('sizes'))}:</b> ${esc(caps)}</div>
    <div class="ni-src">${esc(src)}</div></div>`;
  ov.addEventListener('click', e => { if (e.target === ov || e.target.closest('.ni-x')) closeNozzleInfo(); });
  document.body.appendChild(ov);
  ov.querySelector('.ni-x').focus();
}
function closeNozzleInfo(){ const o = $('niOv'); if (o) o.remove(); }
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeNozzleInfo();
  if ((e.key === 'Enter' || e.key === ' ') && e.target.classList && e.target.classList.contains('ibtn')) { e.preventDefault(); e.target.click(); }
});

function colorName(n){ return T('colors')[CAP_NAME[n.cap]] || ''; }
function dropText(n, P){
  const f = FAMILIES[n.fam];
  if (f.streams) return T('streams');
  const d = dropAt(n, P); return `${T('droplet')}: ${d} · ${T('dropNames')[d] || d}`;
}
function renderResult(i){
  const set = state.sets[i], host = $('res' + i);
  const tr = treatOf(set);
  $('treatSeg' + i).querySelectorAll('.seg-btn').forEach(b => b.classList.toggle('active', b.dataset.treat === tr));
  const ev = evaluate(state.spacing, set);
  const fam = ev.fam, chips = famChips(i, set, fam);
  if (!ev.ready) { host.innerHTML = `<div class="hint" style="margin:0 0 4px">${esc(T('enter'))}</div>${chips}`; return; }
  const need = `${esc(T('flowNeeded'))}: <b>${fmt(ev.Q, 2)} l/min</b>`;
  if (!ev.sel) {
    const maxQ = flowAt(ev.list[ev.list.length - 1], zonesOf(fam).hi);
    host.innerHTML = `<div class="warnbox">${esc(famText(ev.Q > maxQ ? T('tooMuch') : T('tooLittle'), fam).replace('1 bar', zonesOf(fam).lo + ' bar'))}<br>${need}</div>${chips}`;
    return;
  }
  const { n, P } = ev.sel, z = zonesOf(fam), zone = zoneOf(P, fam), zc = ZONE_COLOR[zone];
  const pos = Math.min(100, Math.max(0, (P - P_MIN) / (P_MAX - P_MIN) * 100));
  const filt = n.mesh === 100 ? T('filter100') : n.mesh === 50 ? T('filter50') : T('filterNone');
  const zoneLabel = { opt:T('zoneOpt'), ok:T('zoneOk'), edge:T('zoneEdge'), out:T('zoneOut') }[zone];
  let advice = '';
  if (zone === 'opt') advice = fam.streams ? '' : famText(T('adviceOpt'), fam);
  else if (!fam.streams && P < z.accLo) advice = T('adviceLow');
  else if (!fam.streams && P > z.accHi) advice = T('adviceHigh');
  const vLo = flowAt(n, z.optLo) * 600 / (set.lha * ev.s), vHi = flowAt(n, z.optHi) * 600 / (set.lha * ev.s);
  const alts = ev.cands.length > 1 ? `<div class="alts-title">${esc(T('alternatives'))}</div><div class="alts">` + ev.cands.map(c => {
    const star = ev.best && c.n.id === ev.best.n.id ? ' <span class="star">★</span>' : '';
    return `<button type="button" class="alt${c.n.id === n.id ? ' sel' : ''}" data-set="${i}" data-nozzle="${c.n.id}">
      <span class="sw" style="background:${c.n.color}"></span><span class="a-code">${esc(c.n.code)}${star}</span>${ibtn(fam.id, c.n.id, c.P)}
      <span class="a-p" style="color:${ZONE_COLOR[zoneOf(c.P, fam)]}">${fmt(c.P, 1)} bar</span><span class="a-d">${dropAt(c.n, c.P)}</span></button>`;
  }).join('') + '</div>' : '';
  host.innerHTML = `<div class="rec">
    <div class="rec-top">
      <span class="sw" style="background:${n.color}"></span>
      <div class="rec-info"><div class="rec-code">${esc(n.code)} <small>${esc(n.variants)}</small> ${ibtn(fam.id, n.id, P)}</div>
        <div class="rec-fam"><b>TeeJet ${esc(fam.name)}</b> · ${esc(T('famDesc')[fam.id])}</div>
        <div class="rec-sub">${need}</div></div>
      <div class="rec-p" style="color:${zc}">${fmt(P, 1)}<small>bar</small></div>
    </div>
    <div class="pbar" style="background:${pbarBg(fam)}"><div class="pmark" style="left:${pos}%"></div></div>
    <div class="pscale"><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span></div>
    <div class="badges">${setBadge(zoneLabel, zc)}
      <span class="badge"><span class="sw" style="background:${n.color}"></span>${esc(T('colorLbl'))}: ${esc(colorName(n))}</span>
      <span class="badge">${esc(dropText(n, P))}</span>
      <span class="badge">${esc(T('filter'))}: ${esc(filt)}</span></div>
    ${advice ? `<div class="advice">${esc(advice)}</div>` : ''}
    <div class="vwin">${esc(famText(T('speedWin')(fmt(vLo, 1), fmt(vHi, 1)), fam))}</div>
  </div>${chips}${alts}`;
}

function recalc(){
  state.spacing = currentSpacing();
  state.vmin = Math.max(0.1, parseFloat($('vMin').value) || V_MIN_DEF);
  state.vmax = Math.max(state.vmin + 0.1, parseFloat($('vMax').value) || V_MAX_DEF);
  for (let i = 0; i < 4; i++) {
    $('setSec' + i).style.display = i < state.nSets ? '' : 'none';
    if (i < state.nSets) renderResult(i);
  }
  renderExtra();
}

setsHost.addEventListener('click', e => {
  const ib = e.target.closest('.ibtn');
  if (ib) { e.preventDefault(); e.stopPropagation(); openNozzleInfo(ib.dataset.fam, ib.dataset.nz, parseFloat(ib.dataset.p)); return; }
  const tb = e.target.closest('[data-treat]');
  if (tb) {   // cambio trattamento: si riparte dalla tipologia consigliata
    const st = state.sets[+tb.dataset.set];
    if (st.treat !== tb.dataset.treat) { st.treat = tb.dataset.treat; st.fam = null; st.nozzle = null; recalc(); }
    return;
  }
  const fb = e.target.closest('.fam');
  if (fb) { const st = state.sets[+fb.dataset.set]; st.fam = fb.dataset.fam; st.nozzle = null; recalc(); return; }
  const b = e.target.closest('.alt');
  if (!b) return;
  state.sets[+b.dataset.set].nozzle = b.dataset.nozzle;
  recalc();
});


// ---------------------------------------------------------------------
// Più dosaggi con lo stesso set (si agisce sulla velocità)
// ---------------------------------------------------------------------
function speedFor(n, P, d, s){ return flowAt(n, P) * 600 / (d * s); }   // km/h per avere P bar con dose d
// Velocità migliore per dose d con ugello n, entro [vmin, vmax]: prima zona ottimale, poi accettabile
function bestSpeed(n, d, s, vmin, vmax){
  const z = zonesN(n), vt = speedFor(n, z.target, d, s);
  const tryWin = (pl, ph, level) => {
    pl = Math.max(pl, z.lo); ph = Math.min(ph, z.hi);
    const lo = Math.max(speedFor(n, pl, d, s), vmin), hi = Math.min(speedFor(n, ph, d, s), vmax);
    if (lo > hi + 1e-9) return null;
    const v = Math.min(hi, Math.max(lo, vt));
    return { n, v, P: pressureFor(n, d * v * s / 600), level };
  };
  return tryWin(z.optLo, z.optHi, 'opt') || tryWin(z.accLo, z.accHi, 'ok');
}
function betterRes(a, b){   // true se a è meglio di b
  if ((a.level === 'opt') !== (b.level === 'opt')) return a.level === 'opt';
  return Math.abs(a.P - zonesN(a.n).target) < Math.abs(b.P - zonesN(b.n).target);
}
function combos(n, k, start, cur, out){
  if (cur.length === k) { out.push(cur.slice()); return; }
  for (let i = start; i < n; i++) { cur.push(i); combos(n, k, i + 1, cur, out); cur.pop(); }
}
// Piano: numero minimo di set (1..4) che coprono tutte le dosi entro i limiti di velocità
function planFor(doses, s, vmin, vmax, list){
  list = list || FAM_NOZZLES.AIXR;
  const per = list.map(n => doses.map(d => bestSpeed(n, d.lha, s, vmin, vmax)));
  for (let k = 1; k <= 4; k++) {
    const cl = []; combos(list.length, k, 0, [], cl);
    let best = null;
    cl.forEach(cb => {
      const assign = doses.map((d, di) => {
        let pick = null;
        cb.forEach(ni => { const r = per[ni][di]; if (r && (!pick || betterRes(r, pick.r))) pick = { ni, r }; });
        return pick;
      });
      if (!assign.every(Boolean)) return;
      const opt = assign.filter(a => a.r.level === 'opt').length;
      const dev = assign.reduce((x, a) => x + Math.abs(a.r.P - zonesN(a.r.n).target), 0);
      if (!best || opt > best.opt || (opt === best.opt && dev < best.dev)) best = { cb, assign, opt, dev };
    });
    if (best) {
      const groups = [...new Set(best.assign.map(a => a.ni))].map(ni => ({

function analyzeExtra(){

  const rows = [];
  state.extra.forEach((d, i) => {
    if (!(d > 0) || !ev.sel || !(s > 0)) return;
    const r = bestSpeed(ev.sel.n, d, s, state.vmin, state.vmax);
    let alt = null;
    if (!r) {
      const rs = ev.list.map(n => bestSpeed(n, d, s, state.vmin, state.vmax)).filter(Boolean);
      rs.sort((a, b) => betterRes(a, b) ? -1 : betterRes(b, a) ? 1 : Math.abs(a.v - set.vel) - Math.abs(b.v - set.vel));
      alt = rs[0] || null;
    }
    rows.push({ i, d, r, alt });

  const doses = [];
  if (set.lha > 0) doses.push({ lha:set.lha, main:true });
  state.extra.forEach(d => { if (d > 0) doses.push({ lha:d }); });
  const plan = doses.length >= 2 && s > 0 ? planFor(doses, s, state.vmin, state.vmax, FAM_NOZZLES[famOf(set).id]) : null;

function sanitizeConfig(o){

  const num = v => { v = parseFloat(v); return isFinite(v) && v > 0 ? v : 0; };

  const sets = o.sets.slice(0, 4).map(s => ({

    nozzle: (s && Object.values(FAM_NOZZLES).some(l => l.some(n => n.id === s.nozzle))) ? s.nozzle : null,
    treat: (s && TREATMENTS[s.treat]) ? s.treat : TREAT_DEF,
    fam: (s && FAMILIES[s.fam]) ? s.fam : null

  let vmin = num(o.vmin) || V_MIN_DEF, vmax = num(o.vmax) || V_MAX_DEF;

  const extra = (sets.length === 1 && Array.isArray(o.extra)) ? o.extra.map(num).filter(v => v > 0).slice(0, MAX_EXTRA) : [];
  return { id:(typeof o.id === 'string' && o.id) ? o.id : newId(), name:o.name.trim().slice(0, 60),

function applyTheme(theme){
  document.documentElement.setAttribute('data-theme', theme);

buildSets();
applyLanguage('it');

  function ripple(){
    const r = document.createElement('div'); r.className = 'tut-rip';
    r.style.left = cur.x + 'px'; r.style.top = cur.y + 'px';
    root.appendChild(r); setTimeout(() => r.remove(), 600);
  }
  const api = tk => ({
    $: q,
    wait: ms => sleep(ms, tk),
    spot: s => { targetFn = () => q(s); reveal(q(s)); },
    async point(s){
      reveal(q(s)); await sleep(250, tk);
      curFn = () => { const e = q(s); if (!e) return null; const b = e.getBoundingClientRect(); return { x:b.left + b.width / 2, y:b.top + b.height / 2 }; };
      cursor.classList.add('on'); await sleep(700, tk);
    },
    async click(s){ await this.point(s); ripple(); await sleep(170, tk); const e = q(s); if (e) e.click(); await sleep(380, tk); },
    async type(s, val){
      await this.point(s); ripple();
      const e = q(s); if (!e) return;
      e.value = ''; fire(e, 'input'); await sleep(200, tk);
      let acc = '';
      for (const ch of String(val)) {
        acc += ch;
        if (/[.,]$/.test(acc)) continue;          // i campi numerici rifiutano "2."
        const e2 = q(s); if (!e2) return;
        e2.value = acc; fire(e2, 'input'); await sleep(130, tk);
      }
      await sleep(260, tk);
    }
  });

  function showStep(i){
    const n = C.steps.length;
    elText.textContent = TX(C.steps[i].text);
    elN.textContent = (i + 1) + ' / ' + n;
    root.querySelector('.tut-k').textContent = U('kick');
    root.querySelector('.tut-x').textContent = U('close');
    elProg.style.width = ((i + 1) / n * 100) + '%';
  }
  async function runStep(i){
    const tk = ++token; idx = i;
    const st = C.steps[i];
    showStep(i);
    curFn = null; cursor.classList.remove('on');
    try {
      if (st.before) safe(st.before);
      targetFn = st.el ? () => q(st.el) : null;
      if (st.el) { reveal(q(st.el)); await sleep(650, tk); } else await sleep(300, tk);
      if (st.run) { try { await st.run(api(tk)); } catch (e) { if (e === CANCEL) throw e; console.error('[tutorial]', e); } }
      cursor.classList.remove('on');
      await sleep(st.hold || (1900 + TX(st.text).length * 42), tk);
      if (i + 1 < C.steps.length) runStep(i + 1); else finish();
    } catch (e) { if (e !== CANCEL) console.error('[tutorial]', e); }
  }
  function setPaused(p){ paused = p; elPP.textContent = p ? '▶' : '❚❚'; }
  function closeOv(){ if (ov) { ov.remove(); ov = null; } }
  function card(title, text, a, b, onA, onB){
    closeOv();
    ov = document.createElement('div'); ov.className = 'tut-ov';
    ov.innerHTML = '<div class="tut-card" role="dialog" aria-modal="true"><div class="tut-play">▶</div><h3></h3><p></p>' +
      '<div class="tut-acts"><button type="button"></button><button type="button" class="pri"></button></div></div>';
    ov.querySelector('h3').textContent = title; ov.querySelector('p').textContent = text;
    const bs = ov.querySelectorAll('button');
    bs[0].textContent = b; bs[1].textContent = a;
    bs[0].addEventListener('click', onB); bs[1].addEventListener('click', onA);
    document.body.appendChild(ov); bs[1].focus();
  }
  function start(){
    closeOv();
    if (!active) snap = safe(C.snapshot);
    safe(C.prepare);
    window.scrollTo(0, 0);
    box = null; cur = { x:innerWidth / 2, y:innerHeight * 0.45 }; targetFn = null; curFn = null;
    setPaused(false); bar.style.display = '';
    root.hidden = false;
    if (!active) { active = true; requestAnimationFrame(frame); }
    runStep(0);
  }
  function stop(){
    token++; closeOv();
    active = false; root.hidden = true;
    safe(() => C.restore && C.restore(snap)); snap = null;
    window.scrollTo(0, 0);
  }
  function finish(){
    token++; targetFn = null; curFn = null; cursor.classList.remove('on'); bar.style.display = 'none';
    card(U('eTitle'), U('eText'), U('close'), U('replay'), stop, start);
  }
  function welcome(){
    try { localStorage.setItem(KEY, '1'); } catch (e) {}
    card(U('wTitle'), U('wText'), U('watch'), U('skip'), start, closeOv);
  }
  btn.addEventListener('click', start);
  root.querySelector('.tut-x').addEventListener('click', stop);
  elPP.addEventListener('click', () => setPaused(!paused));
  root.querySelector('.tut-prev').addEventListener('click', () => { setPaused(false); runStep(Math.max(0, idx - 1)); });
  root.querySelector('.tut-next').addEventListener('click', () => { setPaused(false); if (idx + 1 < C.steps.length) runStep(idx + 1); else finish(); });
  document.addEventListener('keydown', e => {
    if (!active) return;
    if (e.key === 'Escape') stop();
    else if (e.key === ' ' && !ov) { e.preventDefault(); setPaused(!paused); }
    else if (e.key === 'ArrowRight' && !ov) root.querySelector('.tut-next').click();
    else if (e.key === 'ArrowLeft' && !ov) root.querySelector('.tut-prev').click();
  });

  // ---- primo utilizzo: proposta automatica (una sola volta per dispositivo) ----
  const KEY = 'caffini_tutorial_' + C.id + '_v1';
  let seen = false;
  try { seen = localStorage.getItem(KEY) === '1'; } catch (e) {}
  const force = /[?&#]tutorial\b/.test(location.search + location.hash);
  if (!seen || force) setTimeout(welcome, 700);
  window.CAFFINI_TOUR_START = start;
})();
</script>
